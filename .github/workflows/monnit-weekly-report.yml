name: Weekly sensor report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # One queue per workflow: GitHub keeps only one *pending* run per group
  # and cancels the rest, so a shared group let a late daily run silently
  # cancel a waiting weekly one. The workflows commit disjoint files, so
  # the pull --rebase before each push is enough to avoid push races.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull in the latest readings first so the report covers all of Sunday
      # even when this runs before the daily workflow (GitHub's cron often
      # fires hours late). The fetch fails when the sensors have gone quiet;
      # the report still runs and publishes a "no data" notice in that case.
      - name: Fetch latest sensor readings
        continue-on-error: true
        env:
          MONNIT_API_KEY_ID: ${{ secrets.MONNIT_API_KEY_ID }}
          MONNIT_API_SECRET_KEY: ${{ secrets.MONNIT_API_SECRET_KEY }}
        run: python Monnit/scripts/fetch_and_append.py

      - name: Generate weekly report
        run: python Monnit/scripts/generate_weekly_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the weekly report is committed here; the freshly fetched data
          # is left for the daily workflow to commit, so the two never edit
          # the same files. Discard it before the rebase, which needs a clean tree.
          git add Monnit/reports/weekly/
          git diff --cached --quiet || git commit -m "Weekly sensor report $(date -u +%Y-%m-%d)"
          git checkout -- .
          git pull --rebase origin main
          git push
