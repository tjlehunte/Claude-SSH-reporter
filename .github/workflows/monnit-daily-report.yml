name: Daily sensor report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: 'One-time backfill: hours of history to pull from the gateway, ignoring the usual high-water mark'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # One queue per workflow: GitHub keeps only one *pending* run per group
  # and cancels the rest, so a shared group let a late daily run silently
  # cancel a waiting weekly one. The workflows commit disjoint files, so
  # the pull --rebase before each push is enough to avoid push races.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and append new sensor readings
        env:
          MONNIT_API_KEY_ID: ${{ secrets.MONNIT_API_KEY_ID }}
          MONNIT_API_SECRET_KEY: ${{ secrets.MONNIT_API_SECRET_KEY }}
          BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours }}
        run: python Monnit/scripts/fetch_and_append.py

      # Still runs after a failed fetch, so a "no data" page gets published;
      # the job as a whole still fails, which is what sends the alert email.
      - name: Generate daily report
        if: ${{ !cancelled() }}
        run: python Monnit/scripts/generate_report.py

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Monnit/data/history.jsonl Monnit/reports/
          git diff --cached --quiet || git commit -m "Daily sensor report $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
